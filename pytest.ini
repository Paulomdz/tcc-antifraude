[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --cov=src
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-fail-under=80
    -v
    -m "not live"
markers =
    live: makes a real Gemini API request; run explicitly with pytest -m live
